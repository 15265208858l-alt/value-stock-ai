name: ValueStock AI Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Verify app entrypoint exists
        run: test -f app.py
      - name: Runtime smoke test core scoring
        run: |
          python - <<'PY'
          from investment_score import calculate_investment_score
          from risk import analyze_financial_risk
          from financial import calculate_financial_quality
          import pandas as pd

          risk = analyze_financial_risk(120, 100, 20, 200, 30, 15, 45)
          assert 0 <= risk["score"] <= 10

          trend = pd.DataFrame({
              "ROE": [15, 16, 17, 18, 19],
              "营收增长率": [8, 9, 10, 11, 12],
              "净利润增长率": [10, 11, 12, 13, 14],
              "资产负债率": [45, 44, 43, 42, 41],
          })
          financial_score = calculate_financial_quality(trend, 1.1)
          assert isinstance(financial_score, (int, float))
          assert 0 <= financial_score <= 100

          result = calculate_investment_score(
              financial_score=financial_score,
              peer_score=80,
              valuation_gap=25,
              risk_score=risk["score"],
              historical_percentile=35,
              roe=19,
              revenue_growth=12,
              profit_growth=14,
              cashflow_ratio=1.1,
              debt_ratio=41,
              receivable_to_revenue=0.1,
              inventory_to_revenue=0.2,
              realization_score=80,
          )
          assert 0 <= result["score"] <= 100
          assert "rating" in result
          assert "research_status" in result
          print("core scoring smoke test passed:", result["score"], result["rating"])
          PY
      - name: Runtime smoke test free cash flow
        run: |
          python - <<'PY'
          from fcf_analysis import build_fcf_analysis
          good = build_fcf_analysis(120, 100, 30, 25)
          assert good["available"] is True
          assert good["fcf"] == 90
          assert good["hard_veto"] is False

          veto = build_fcf_analysis(-20, 30, 10, 8)
          assert veto["hard_veto"] is True
          assert "利润现金含量异常" in " ".join(veto["items"])
          print("fcf smoke test passed:", good["level"], veto["level"])
          PY
