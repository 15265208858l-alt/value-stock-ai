name: ValueStock AI Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Verify app entrypoint exists
        run: test -f app.py
      - name: Runtime smoke test core scoring
        run: |
          python - <<'PY'
          from investment_score import calculate_investment_score
          from risk import analyze_financial_risk
          from financial import calculate_financial_quality
          import pandas as pd

          risk = analyze_financial_risk(120, 100, 20, 200, 30, 15, 45)
          assert 0 <= risk["score"] <= 10

          trend = pd.DataFrame({
              "ROE": [15, 16, 17, 18, 19],
              "营收增长率": [8, 9, 10, 11, 12],
              "净利润增长率": [10, 11, 12, 13, 14],
              "资产负债率": [45, 44, 43, 42, 41],
          })
          financial_score = calculate_financial_quality(trend, 1.1)
          assert isinstance(financial_score, (int, float))
          assert 0 <= financial_score <= 100

          result = calculate_investment_score(
              financial_score=financial_score,
              peer_score=80,
              valuation_gap=25,
              risk_score=risk["score"],
              historical_percentile=35,
              roe=19,
              revenue_growth=12,
              profit_growth=14,
              cashflow_ratio=1.1,
              debt_ratio=41,
              receivable_to_revenue=0.1,
              inventory_to_revenue=0.2,
              realization_score=80,
          )
          assert 0 <= result["score"] <= 100
          assert "rating" in result
          assert "research_status" in result
          print("core scoring smoke test passed:", result["score"], result["rating"])
          PY
      - name: Runtime smoke test free cash flow
        run: |
          python - <<'PY'
          from fcf_analysis import build_fcf_analysis
          good = build_fcf_analysis(120, 100, 30, 25)
          assert good["available"] is True
          assert good["fcf"] == 90
          assert good["hard_veto"] is False

          veto = build_fcf_analysis(-20, 30, 10, 8)
          assert veto["hard_veto"] is True
          assert "利润现金含量异常" in " ".join(veto["items"])
          print("fcf smoke test passed:", good["level"], veto["level"])
          PY
      - name: Runtime smoke test valuation
        run: |
          python - <<'PY'
          from valuation import calculate_valuation_scenarios, calculate_safety_margin, classify_valuation_status, build_buying_plan

          vr = calculate_valuation_scenarios(
              eps=2.0,
              bvps=12.0,
              conservative_pe=15,
              normal_pe=20,
              optimistic_pe=25,
              conservative_pb=1.5,
              normal_pb=2.0,
              optimistic_pb=2.5,
              current_price=25,
              data_confidence="高",
          )
          assert vr["normal"] is not None
          assert vr["entry_price"] < vr["normal"]
          assert vr["heavy_price"] < vr["entry_price"]
          assert vr["high_price"] > vr["normal"]
          assert vr["safety_margin"] is not None

          margin = calculate_safety_margin(20, 30)
          assert abs(margin - (1 / 3)) < 1e-9

          status = classify_valuation_status(18, 30, heavy_price=21, entry_price=25, high_price=34)
          assert status["level"] == "深度价值区"

          veto_plan = build_buying_plan(30, current_price=15, risk_level="高风险 / 否决", confidence="高")
          assert veto_plan["suggested_position"] == "0%"
          assert "风险否决" in veto_plan["discipline"]

          print("valuation smoke test passed:", vr["normal"], vr["status"], veto_plan["suggested_position"])
          PY
